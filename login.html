<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinPoint - 로그인</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); }
    .auth-box { width:100%; max-width:420px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:40px; }
    .auth-logo { text-align:center; font-size:28px; font-weight:800; color:var(--accent-gold); margin-bottom:8px; }
    .auth-logo span { color:var(--text-primary); }
    .auth-sub { text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:32px; }
    .auth-tabs { display:flex; gap:0; margin-bottom:28px; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
    .auth-tab { flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; cursor:pointer; background:var(--bg-secondary); color:var(--text-muted); border:none; transition:all 0.15s; }
    .auth-tab.active { background:var(--accent-gold); color:#0f0f13; }
    .auth-form { display:none; }
    .auth-form.active { display:block; }
    .auth-divider { text-align:center; font-size:12px; color:var(--text-muted); margin:16px 0; }
    .auth-footer { text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px; line-height:1.6; }
  </style>
</head>
<body>
<div class="auth-box">
  <div class="auth-logo">Pin<span>Point</span>.</div>
  <div class="auth-sub">회사의 꽃 경리. 당신의 가치를 올려드립니다.</div>

  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">로그인</button>
    <button class="auth-tab" onclick="switchTab('signup')">회원가입</button>
  </div>

  <!-- 로그인 -->
  <div class="auth-form active" id="form-login">
    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" class="form-input" id="login-email" placeholder="example@company.com">
    </div>
    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" class="form-input" id="login-password" placeholder="비밀번호 입력">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="login()" id="login-btn">로그인</button>
    <div class="auth-divider">또는</div>
    <button class="btn btn-outline" style="width:100%;" onclick="loginDemo()">🔍 데모로 둘러보기</button>
  </div>

  <!-- 회원가입 -->
  <div class="auth-form" id="form-signup">
    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" class="form-input" id="signup-email" placeholder="example@company.com">
    </div>
    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" class="form-input" id="signup-password" placeholder="8자 이상">
    </div>
    <div class="form-group">
      <label class="form-label">비밀번호 확인</label>
      <input type="password" class="form-input" id="signup-password2" placeholder="비밀번호 재입력">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="signup()" id="signup-btn">회원가입</button>
  </div>

  <div id="auth-msg" style="margin-top:14px;font-size:13px;text-align:center;display:none;"></div>

  <div class="auth-footer">
    베타 기간 무료 · 개인정보는 안전하게 보호됩니다
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>
  // 이미 로그인된 경우 대시보드로
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'dashboard.html';

    // URL 파라미터로 탭 결정 (?tab=signup 이면 회원가입 탭 먼저)
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'signup') switchTab('signup');
  })();

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t,i) => {
      t.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='signup'));
    });
    document.getElementById('form-login').classList.toggle('active', tab==='login');
    document.getElementById('form-signup').classList.toggle('active', tab==='signup');
    hideMsg();
  }

  function showMsg(msg, type='error') {
    const el = document.getElementById('auth-msg');
    el.style.display = 'block';
    el.style.color = type === 'error' ? 'var(--danger)' : 'var(--success)';
    el.textContent = msg;
  }

  function hideMsg() {
    document.getElementById('auth-msg').style.display = 'none';
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showMsg('이메일과 비밀번호를 입력해주세요.');
    const btn = document.getElementById('login-btn');
    btn.textContent = '로그인 중...'; btn.disabled = true;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      showMsg('이메일 또는 비밀번호가 올바르지 않습니다.');
      btn.textContent = '로그인'; btn.disabled = false;
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  async function signup() {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const password2 = document.getElementById('signup-password2').value;
    if (!email || !password) return showMsg('이메일과 비밀번호를 입력해주세요.');
    if (password.length < 8) return showMsg('비밀번호는 8자 이상이어야 합니다.');
    if (password !== password2) return showMsg('비밀번호가 일치하지 않습니다.');
    const btn = document.getElementById('signup-btn');
    btn.textContent = '가입 중...'; btn.disabled = true;
    const { error } = await supabase.auth.signUp({ email, password });
    if (error) {
      showMsg(error.message);
      btn.textContent = '회원가입'; btn.disabled = false;
    } else {
      showMsg('가입 완료! 이메일 인증 후 로그인해주세요.', 'success');
      btn.textContent = '회원가입'; btn.disabled = false;
    }
  }

  function loginDemo() {
    localStorage.setItem('pinpoint_demo', 'true');
    window.location.href = 'dashboard.html';
  }

  // 엔터키 지원
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const activeForm = document.querySelector('.auth-form.active').id;
      if (activeForm === 'form-login') login();
      else signup();
    }
  });
</script>
</body>
</html>
