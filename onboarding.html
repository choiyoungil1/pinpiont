<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinPoint - 기업 정보 등록</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; background:var(--bg-primary); }

    .onboard-wrap { width:100%; max-width:560px; }

    .onboard-logo { text-align:center; font-size:22px; font-weight:800; color:var(--accent-gold); margin-bottom:8px; }
    .onboard-logo span { color:var(--text-primary); }
    .onboard-welcome { text-align:center; font-size:14px; color:var(--text-secondary); margin-bottom:32px; }

    /* 스텝 표시 */
    .steps { display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:32px; }
    .step { display:flex; align-items:center; gap:8px; }
    .step-circle {
      width:32px; height:32px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:800;
      border:2px solid var(--border);
      color:var(--text-muted);
      background:var(--bg-secondary);
      transition:all 0.2s;
    }
    .step-circle.active { border-color:var(--accent-gold); color:var(--accent-gold); background:rgba(201,168,76,0.1); }
    .step-circle.done { border-color:var(--success); color:var(--success); background:rgba(76,175,130,0.1); }
    .step-label { font-size:12px; color:var(--text-muted); }
    .step-label.active { color:var(--text-primary); font-weight:600; }
    .step-line { width:40px; height:2px; background:var(--border); margin:0 8px; }
    .step-line.done { background:var(--success); }

    .onboard-card {
      background:var(--bg-secondary);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:32px;
    }
    .onboard-title { font-size:18px; font-weight:800; margin-bottom:6px; }
    .onboard-desc { font-size:13px; color:var(--text-secondary); margin-bottom:28px; }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:480px) { .form-row { grid-template-columns:1fr; } }

    .form-group { margin-bottom:20px; }
    .form-label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
    .form-label .req { color:var(--accent-gold); }
    .form-input, .form-select {
      width:100%; padding:10px 14px;
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius-sm); color:var(--text-primary);
      font-size:14px; transition:border-color 0.15s;
    }
    .form-input:focus, .form-select:focus { outline:none; border-color:var(--accent-gold); }
    .form-select option { background:var(--bg-card); }
    .form-hint { font-size:11px; color:var(--text-muted); margin-top:5px; }

    /* 법인/개인 토글 */
    .type-toggle { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .type-btn {
      padding:10px; border-radius:var(--radius-sm);
      border:2px solid var(--border); background:var(--bg-card);
      color:var(--text-secondary); font-size:14px; font-weight:600;
      cursor:pointer; text-align:center; transition:all 0.15s;
    }
    .type-btn.selected { border-color:var(--accent-gold); color:var(--accent-gold); background:rgba(201,168,76,0.08); }

    /* 임원 추가 */
    .director-list { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
    .director-item {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:14px;
      display:grid; grid-template-columns:1fr 1fr auto;
      gap:10px; align-items:end;
    }
    .director-item .form-group { margin-bottom:0; }
    .director-remove {
      width:32px; height:36px; border-radius:var(--radius-sm);
      background:rgba(232,90,74,0.1); border:1px solid rgba(232,90,74,0.3);
      color:var(--danger); cursor:pointer; font-size:16px;
      display:flex; align-items:center; justify-content:center;
    }
    .add-director-btn {
      width:100%; padding:9px; border-radius:var(--radius-sm);
      border:1px dashed var(--border); background:transparent;
      color:var(--text-muted); font-size:13px; cursor:pointer;
      transition:all 0.15s;
    }
    .add-director-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }

    .btn-row { display:flex; gap:12px; margin-top:8px; }
    .btn-row .btn { flex:1; justify-content:center; }

    #msg { margin-top:12px; font-size:13px; text-align:center; display:none; }
  </style>
</head>
<body>

<div class="onboard-wrap">
  <a href="index.html" style="text-decoration:none;">
    <div class="onboard-logo">Pin<span>Point</span>.</div>
  </a>
  <div class="onboard-welcome">서비스 이용을 위해 회사 정보를 등록해주세요</div>

  <!-- 스텝 표시 -->
  <div class="steps">
    <div class="step">
      <div class="step-circle active" id="circle1">1</div>
      <div class="step-label active" id="label1">기본 정보</div>
    </div>
    <div class="step-line" id="line1"></div>
    <div class="step">
      <div class="step-circle" id="circle2">2</div>
      <div class="step-label" id="label2">상세 정보</div>
    </div>
  </div>

  <!-- 1단계: 기본 정보 -->
  <div class="onboard-card" id="step1">
    <div class="onboard-title">📋 회사 기본 정보</div>
    <div class="onboard-desc">정확한 일정 계산을 위해 필요한 정보예요</div>

    <div class="form-group">
      <label class="form-label">회사명 <span class="req">*</span></label>
      <input type="text" class="form-input" id="company-name" placeholder="(주)홍길동컴퍼니">
    </div>

    <div class="form-group">
      <label class="form-label">사업자등록번호 <span class="req">*</span></label>
      <input type="text" class="form-input" id="business-number" placeholder="000-00-00000" maxlength="12">
      <div class="form-hint">숫자만 입력하면 자동으로 형식이 맞춰져요</div>
    </div>

    <div class="form-group">
      <label class="form-label">사업자 구분 <span class="req">*</span></label>
      <div class="type-toggle">
        <div class="type-btn selected" id="type-corp" onclick="selectType('법인')">🏢 법인사업자</div>
        <div class="type-btn" id="type-sole" onclick="selectType('개인')">👤 개인사업자</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">결산월 <span class="req">*</span></label>
      <select class="form-select" id="fiscal-month">
        <option value="">선택해주세요</option>
        <option value="1">1월</option>
        <option value="2">2월</option>
        <option value="3">3월</option>
        <option value="4">4월</option>
        <option value="5">5월</option>
        <option value="6">6월</option>
        <option value="7">7월</option>
        <option value="8">8월</option>
        <option value="9">9월</option>
        <option value="10">10월</option>
        <option value="11">11월</option>
        <option value="12">12월 (일반적)</option>
      </select>
      <div class="form-hint">대부분의 법인은 12월 결산이에요</div>
    </div>

    <div id="msg"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStep()">다음 →</button>
    </div>
  </div>

  <!-- 2단계: 상세 정보 -->
  <div class="onboard-card" id="step2" style="display:none;">
    <div class="onboard-title">🏭 회사 상세 정보</div>
    <div class="onboard-desc">지원금·인증 검색에 활용되는 정보예요</div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">업종</label>
        <select class="form-select" id="industry">
          <option value="">선택 (선택사항)</option>
          <option value="제조업">제조업</option>
          <option value="도소매업">도소매업</option>
          <option value="서비스업">서비스업</option>
          <option value="건설업">건설업</option>
          <option value="IT/소프트웨어">IT/소프트웨어</option>
          <option value="음식점/숙박">음식점/숙박</option>
          <option value="의료/보건">의료/보건</option>
          <option value="교육">교육</option>
          <option value="부동산">부동산</option>
          <option value="운수/물류">운수/물류</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">상시근로자 수</label>
        <select class="form-select" id="employee-count">
          <option value="">선택 (선택사항)</option>
          <option value="1~4명">1~4명</option>
          <option value="5~9명">5~9명</option>
          <option value="10~29명">10~29명</option>
          <option value="30~49명">30~49명</option>
          <option value="50~99명">50~99명</option>
          <option value="100~299명">100~299명</option>
          <option value="300명 이상">300명 이상</option>
        </select>
        <div class="form-hint">💡 대표이사·등기임원 제외, 4대보험 가입 근로자 기준<br>단시간 근로자는 근무시간 비율로 환산</div>
      </div>
    </div>

    <!-- 임원 정보 (법인만) -->
    <div id="director-section">
      <div class="form-label" style="margin-bottom:10px;">임원 정보 <span style="font-size:11px;color:var(--text-muted);font-weight:400;">(법인만 해당 · 선택사항)</span></div>
      <div class="director-list" id="director-list"></div>
      <button class="add-director-btn" onclick="addDirector()">+ 임원 추가</button>
      <div class="form-hint" style="margin-top:6px;">임기 시작일 기준으로 만료 D-day를 계산해드려요</div>
    </div>

    <div id="msg2"></div>
    <div class="btn-row" style="margin-top:24px;">
      <button class="btn btn-ghost" onclick="prevStep()">← 이전</button>
      <button class="btn btn-primary" onclick="submit()">등록 완료 →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>
  let selectedType = '법인';
  let directors = [];

  // 이미 기업정보 있으면 대시보드로
  window.addEventListener('DOMContentLoaded', async () => {
    const user = await requireAuth();
    if (!user) return;
    const company = await CompanyDB.get();
    if (company && company.name) {
      window.location.href = 'dashboard.html';
    }
  });

  function selectType(type) {
    selectedType = type;
    document.getElementById('type-corp').classList.toggle('selected', type === '법인');
    document.getElementById('type-sole').classList.toggle('selected', type === '개인');
    document.getElementById('director-section').style.display = type === '법인' ? 'block' : 'none';
  }

  // 사업자번호 자동 포맷
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('business-number');
    if (input) {
      input.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '');
        if (v.length > 3 && v.length <= 5) v = v.slice(0,3) + '-' + v.slice(3);
        else if (v.length > 5) v = v.slice(0,3) + '-' + v.slice(3,5) + '-' + v.slice(5,10);
        e.target.value = v;
      });
    }
  });

  function showMsg(id, msg, type='error') {
    const el = document.getElementById(id);
    el.style.display = 'block';
    el.style.color = type === 'error' ? 'var(--danger)' : 'var(--success)';
    el.textContent = msg;
  }

  function nextStep() {
    const name = document.getElementById('company-name').value.trim();
    const bn = document.getElementById('business-number').value.trim();
    const fm = document.getElementById('fiscal-month').value;
    if (!name) return showMsg('msg', '회사명을 입력해주세요.');
    if (!bn) return showMsg('msg', '사업자등록번호를 입력해주세요.');
    if (!fm) return showMsg('msg', '결산월을 선택해주세요.');

    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';

    // 스텝 표시 업데이트
    document.getElementById('circle1').classList.remove('active');
    document.getElementById('circle1').classList.add('done');
    document.getElementById('circle1').textContent = '✓';
    document.getElementById('label1').classList.remove('active');
    document.getElementById('line1').classList.add('done');
    document.getElementById('circle2').classList.add('active');
    document.getElementById('label2').classList.add('active');

    // 개인사업자면 임원 섹션 숨김
    if (selectedType === '개인') {
      document.getElementById('director-section').style.display = 'none';
    }
  }

  function prevStep() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';

    document.getElementById('circle1').classList.add('active');
    document.getElementById('circle1').classList.remove('done');
    document.getElementById('circle1').textContent = '1';
    document.getElementById('label1').classList.add('active');
    document.getElementById('line1').classList.remove('done');
    document.getElementById('circle2').classList.remove('active');
    document.getElementById('label2').classList.remove('active');
  }

  function addDirector() {
    const id = Date.now();
    directors.push({ id, name:'', startDate:'' });
    renderDirectors();
  }

  function removeDirector(id) {
    directors = directors.filter(d => d.id !== id);
    renderDirectors();
  }

  function renderDirectors() {
    const list = document.getElementById('director-list');
    const currentYear = new Date().getFullYear();
    const years = Array.from({length: 20}, (_, i) => currentYear - 15 + i); // 15년전 ~ 4년후
    const months = Array.from({length: 12}, (_, i) => i + 1);
    const days = Array.from({length: 31}, (_, i) => i + 1);

    list.innerHTML = directors.map(d => {
      const parts = d.startDate ? d.startDate.split('-') : ['', '', ''];
      const y = parts[0] || '', m = parts[1] || '', day = parts[2] || '';
      return `
      <div class="director-item" style="grid-template-columns:1fr 2fr auto;">
        <div class="form-group">
          <label class="form-label">이름</label>
          <input type="text" class="form-input" placeholder="홍길동" value="${d.name}"
            oninput="updateDirector(${d.id}, 'name', this.value)">
        </div>
        <div class="form-group">
          <label class="form-label">임기 시작일</label>
          <div style="display:grid; grid-template-columns:2fr 1.5fr 1.5fr; gap:6px;">
            <select class="form-select" onchange="updateDirectorDate(${d.id}, 'y', this.value)">
              <option value="">연도</option>
              ${years.map(yr => `<option value="${yr}" ${String(yr)===y?'selected':''}>${yr}년</option>`).join('')}
            </select>
            <select class="form-select" onchange="updateDirectorDate(${d.id}, 'm', this.value)">
              <option value="">월</option>
              ${months.map(mo => `<option value="${String(mo).padStart(2,'0')}" ${String(mo).padStart(2,'0')===m?'selected':''}>${mo}월</option>`).join('')}
            </select>
            <select class="form-select" onchange="updateDirectorDate(${d.id}, 'd', this.value)">
              <option value="">일</option>
              ${days.map(dd => `<option value="${String(dd).padStart(2,'0')}" ${String(dd).padStart(2,'0')===day?'selected':''}>${dd}일</option>`).join('')}
            </select>
          </div>
        </div>
        <button class="director-remove" onclick="removeDirector(${d.id})">×</button>
      </div>
    `}).join('');
  }

  function updateDirectorDate(id, part, value) {
    const d = directors.find(x => x.id === id);
    if (!d) return;
    const parts = d.startDate ? d.startDate.split('-') : ['', '', ''];
    if (part === 'y') parts[0] = value;
    if (part === 'm') parts[1] = value;
    if (part === 'd') parts[2] = value;
    d.startDate = parts.join('-');
  }

  async function submit() {
    const btn = document.querySelector('#step2 .btn-primary');
    btn.textContent = '저장 중...'; btn.disabled = true;

    const companyData = {
      name: document.getElementById('company-name').value.trim(),
      businessNumber: document.getElementById('business-number').value.trim(),
      type: selectedType,
      fiscalMonth: parseInt(document.getElementById('fiscal-month').value),
      industry: document.getElementById('industry').value || '',
      employeeCount: document.getElementById('employee-count').value || '',
      directors: directors.filter(d => d.name).map(d => ({ name: d.name, startDate: d.startDate }))
    };

    try {
      // localStorage에 먼저 저장 (백업)
      Storage.set('company', companyData);

      // DB 저장
      await CompanyDB.set(companyData);

      // 저장 확인
      const saved = await CompanyDB.get();
      if (saved && saved.name) {
        window.location.href = 'dashboard.html';
      } else {
        // DB 저장 실패해도 localStorage에 있으니 진행
        window.location.href = 'dashboard.html';
      }
    } catch(e) {
      console.error('저장 오류:', e);
      // localStorage에 저장됐으면 그냥 진행
      const local = Storage.get('company');
      if (local && local.name) {
        window.location.href = 'dashboard.html';
      } else {
        showMsg('msg2', '저장 중 오류가 발생했습니다. 다시 시도해주세요.');
        btn.textContent = '등록 완료 →'; btn.disabled = false;
      }
    }
  }
</script>
</body>
</html>
